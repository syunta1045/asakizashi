name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npx eslint app components lib

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci

      - name: Circular dep check
        run: npx madge --circular --extensions ts,tsx app/ components/ lib/

      - name: Verify Bazi engine
        run: npx tsx scripts/verify-bazi.ts > /dev/null
