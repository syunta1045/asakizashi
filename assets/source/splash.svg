<svg width="1242" height="2688" viewBox="0 0 1242 2688" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1F2E4A"/>
      <stop offset="30%"  stop-color="#5B4274"/>
      <stop offset="60%"  stop-color="#C26E70"/>
      <stop offset="80%"  stop-color="#EBA47E"/>
      <stop offset="100%" stop-color="#F5DDB5"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFCEF" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#FFE4A8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD89E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1242" height="2688" fill="url(#dawn)"/>

  <!-- 太陽 -->
  <circle cx="621" cy="900" r="280" fill="url(#sun)"/>
  <circle cx="621" cy="900" r="160" fill="#FFFCEF" opacity="0.95"/>

  <!-- ブランド -->
  <text
    x="621" y="1500"
    font-family="Yu Mincho, Hiragino Mincho ProN, serif"
    font-size="220"
    font-weight="500"
    text-anchor="middle"
    fill="#FFFFFF"
    letter-spacing="80">
    旭兆
  </text>

  <text
    x="621" y="1620"
    font-family="Helvetica Neue, sans-serif"
    font-size="36"
    text-anchor="middle"
    fill="#FFFFFF"
    opacity="0.85"
    letter-spacing="12">
    Asakizashi
  </text>

  <text
    x="621" y="1720"
    font-family="Yu Mincho, Hiragino Mincho ProN, serif"
    font-size="32"
    text-anchor="middle"
    fill="#FFFFFF"
