<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2E4A"/>
      <stop offset="40%" stop-color="#5B4274"/>
      <stop offset="74%" stop-color="#C26E70"/>
      <stop offset="100%" stop-color="#F5DDB5"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="42%" r="54%">
      <stop offset="0%" stop-color="#FFF6DA"/>
      <stop offset="100%" stop-color="#F1B95F"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F6C66F" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#F6C66F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <g transform="translate(286 250)">
    <circle cx="0" cy="0" r="250" fill="url(#glow)"/>
    <circle cx="0" cy="0" r="120" fill="url(#sun)"/>
    <g fill="#FBF2DD">
      <rect x="-198" y="44"  width="144" height="24" rx="12" opacity="0.9"/>
      <rect x="-150" y="78"  width="300" height="28" rx="14" opacity="0.95"/>
      <rect x="-54"  y="116" width="216" height="24" rx="12" opacity="0.92"/>
      <rect x="66"   y="116" width="96"  height="20" rx="10" opacity="0.8"/>
      <rect x="-114" y="152" width="170" height="20" rx="10" opacity="0.85"/>
    </g>
    <g fill="#E3AE57">
      <circle cx="150" cy="150" r="5"/>
      <circle cx="172" cy="172" r="4"/>
      <circle cx="194" cy="150" r="3"/>
    </g>
  </g>

  <text x="498" y="248"
        font-family="Hiragino Mincho ProN, Yu Mincho, serif"
        font-size="84" font-weight="500" fill="#FFF8EA" letter-spacing="12">朝しるべ</text>
  <text x="500" y="330"
        font-family="Hiragino Mincho ProN, Yu Mincho, serif"
        font-size="32" fill="#FFF8EA" opacity="0.9" letter-spacing="4">毎朝1分の、セルフケア日記</text>
</svg>
