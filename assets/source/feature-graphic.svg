<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1422"/>
      <stop offset="42%" stop-color="#462638"/>
      <stop offset="75%" stop-color="#C26E70"/>
      <stop offset="100%" stop-color="#F5DDB5"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9EA"/>
      <stop offset="100%" stop-color="#EBD0A0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#FFF6DA"/>
      <stop offset="100%" stop-color="#F1B95F"/>
    </radialGradient>
    <radialGradient id="glow" cx="31%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#F6C66F" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#F6C66F" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#160F18" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#sky)"/>
  <circle cx="300" cy="294" r="238" fill="url(#glow)"/>

  <g transform="translate(294 260) rotate(-2)" filter="url(#shadow)">
    <rect x="-112" y="-138" width="224" height="276" rx="34" fill="url(#paper)"/>
    <circle cx="0" cy="-18" r="82" fill="url(#sun)"/>
  </g>

  <text x="500" y="204"
        font-family="Yu Mincho, Hiragino Mincho ProN, serif"
        font-size="86"
        font-weight="500"
        fill="#FFFFFF"
        letter-spacing="12">
    朝しるべ
  </text>
  <text x="504" y="292"
        font-family="Yu Mincho, Hiragino Mincho ProN, serif"
        font-size="30"
        fill="#FFF9EA"
        letter-spacing="5">
    今日を整える一行
  </text>
  <text x="506" y="348"
        font-family="Yu Mincho, Hiragino Mincho ProN, serif"
        font-size="22"
        fill="#FFFFFF"
        opacity="0.78"
        letter-spacing="3">
    朝のひとときに、やさしいしるべを。
  </text>
</svg>
