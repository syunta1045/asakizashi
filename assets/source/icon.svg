<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 朝焼けグラデーション -->
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1F2E4A"/>
      <stop offset="30%"  stop-color="#5B4274"/>
      <stop offset="60%"  stop-color="#C26E70"/>
      <stop offset="80%"  stop-color="#EBA47E"/>
      <stop offset="100%" stop-color="#F5DDB5"/>
    </linearGradient>
    <!-- 太陽の光輪 -->
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFCEF" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#FFE4A8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD89E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景: 朝焼けグラデ -->
  <rect width="1024" height="1024" fill="url(#dawn)"/>

  <!-- 太陽の光輪 -->
  <circle cx="512" cy="640" r="320" fill="url(#sun)"/>
  <circle cx="512" cy="640" r="180" fill="#FFFCEF"/>

  <!-- 「旭」一文字を中央に -->
  <text
    x="512" y="540"
    font-family="Yu Mincho, Hiragino Mincho ProN, serif"
    font-size="540"
    font-weight="500"
    text-anchor="middle"
    fill="#FFFFFF"
    style="paint-order: stroke; stroke: #1F2E4A; stroke-width: 0;"
    letter-spacing="0">
    旭
  </text>
</svg>
