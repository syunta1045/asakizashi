<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1422"/>
      <stop offset="56%" stop-color="#462638"/>
      <stop offset="100%" stop-color="#D99B68"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9EA"/>
      <stop offset="100%" stop-color="#EBD0A0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#FFF6DA"/>
      <stop offset="100%" stop-color="#F1B95F"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="56%" r="56%">
      <stop offset="0%" stop-color="#F6C66F" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#F6C66F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="320" cy="356" r="280" fill="url(#glow)"/>

  <g transform="translate(320 332) rotate(-2)">
    <rect x="-132" y="-164" width="264" height="328" rx="36" fill="url(#paper)"/>
    <circle cx="0" cy="-20" r="94" fill="url(#sun)"/>
  </g>

  <text x="560" y="238"
        font-family="Yu Mincho, Hiragino Mincho ProN, serif"
        font-size="92"
        font-weight="500"
        fill="#FFFFFF"
        letter-spacing="14">
    朝しるべ
  </text>
  <text x="562" y="408"
        font-family="Yu Mincho, Hiragino Mincho ProN, serif"
        font-size="32"
        fill="#FFF9EA"
        letter-spacing="4">
    朝のひとときに、今日を整える一行を
  </text>
</svg>
