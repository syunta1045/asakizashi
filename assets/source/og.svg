      <rect x="-178" y="92"  width="356" height="32" rx="16" opacity="0.95"/>
      <rect x="-64"  y="136" width="256" height="28" rx="14" opacity="0.92"/>
      <rect x="78"   y="136" width="114" height="24" rx="12" opacity="0.8"/>
      <rect x="-135" y="178" width="200" height="24" rx="12" opacity="0.85"/>
    </g>
    <g fill="#E3AE57">
      <circle cx="178" cy="178" r="6"/>
