<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1F2E4A"/>
      <stop offset="30%"  stop-color="#5B4274"/>
      <stop offset="60%"  stop-color="#C26E70"/>
      <stop offset="80%"  stop-color="#EBA47E"/>
      <stop offset="100%" stop-color="#F5DDB5"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFCEF" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#FFE4A8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFD89E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dawn)"/>

  <!-- Sun -->
  <circle cx="600" cy="380" r="180" fill="url(#sun)"/>
  <circle cx="600" cy="380" r="100" fill="#FFFCEF" opacity="0.95"/>

  <!-- Brand -->
  <text x="600" y="220"
        font-family="Yu Mincho, Hiragino Mincho ProN, serif"
        font-size="120"
        font-weight="500"
        text-anchor="middle"
        fill="#FFFFFF"
        letter-spacing="40">
    旭兆
  </text>
  <text x="600" y="290"
        font-family="Helvetica Neue, sans-serif"
        font-size="22"
        text-anchor="middle"
        fill="#FFFFFF"
        opacity="0.85"
        letter-spacing="10">
    Asakizashi — A morning oracle
  </text>

  <text x="600" y="560"
        font-family="Yu Mincho, Hiragino Mincho ProN, serif"
        font-size="28"
        text-anchor="middle"
        fill="#FFFFFF"
        opacity="0.95"
        letter-spacing="6">
    毎朝、あなたへの一行のお告げ
  </text>
</svg>
