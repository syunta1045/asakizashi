<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFCEF" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#FFE4A8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFD89E" stop-opacity="0"/>
