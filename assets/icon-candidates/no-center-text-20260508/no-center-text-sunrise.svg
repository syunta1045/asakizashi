<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="46%" stop-color="#3F263D"/>
      <stop offset="74%" stop-color="#B87355"/>
      <stop offset="100%" stop-color="#F2C178"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#FFF4C8"/>
      <stop offset="58%" stop-color="#F6BE5F"/>
      <stop offset="100%" stop-color="#E68742"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="63%" r="52%">
