<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1422"/>
      <stop offset="56%" stop-color="#462638"/>
      <stop offset="100%" stop-color="#D99B68"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9EA"/>
      <stop offset="100%" stop-color="#EBD0A0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#FFF6DA"/>
      <stop offset="100%" stop-color="#F1B95F"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="56%" r="56%">
      <stop offset="0%" stop-color="#F6C66F" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#F6C66F" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.76" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.032"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.34"/>
  <circle cx="512" cy="596" r="352" fill="url(#glow)"/>
  <g transform="translate(512 540) rotate(-2)">
    <rect x="-190" y="-236" width="380" height="472" rx="52" fill="url(#paper)"/>
    <circle cx="0" cy="-28" r="136" fill="url(#sun)"/>
  </g>
</svg>