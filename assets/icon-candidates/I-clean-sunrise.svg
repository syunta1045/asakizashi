<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08111E"/>
      <stop offset="48%" stop-color="#332238"/>
      <stop offset="78%" stop-color="#A65D55"/>
      <stop offset="100%" stop-color="#E6A96D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="66%" r="52%">
      <stop offset="0%" stop-color="#FFF3D1" stop-opacity="0.95"/>
